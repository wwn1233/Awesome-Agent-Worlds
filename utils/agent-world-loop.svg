<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" role="img" aria-labelledby="title desc">
  <title id="title">Agent World Production Loop</title>
  <desc id="desc">Flow diagram from task demand through world runtime, rollout, verifier, trajectory store, training, regression gate, and production agent.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="920" height="300" rx="18" fill="#f8fafc"/>
  <text x="460" y="46" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Agent World Production Loop</text>
  <text x="460" y="72" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#475569">Turn task demand into verified trajectories for training, regression gates, and production agents</text>

  <g font-family="Inter, Arial, sans-serif" font-size="13" fill="#0f172a">
    <rect x="42" y="118" width="96" height="58" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="90" y="142" text-anchor="middle" font-weight="700">Task</text>
    <text x="90" y="161" text-anchor="middle">Demand</text>

    <rect x="178" y="118" width="108" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="232" y="142" text-anchor="middle" font-weight="700">World</text>
    <text x="232" y="161" text-anchor="middle">Runtime</text>

    <rect x="326" y="118" width="108" height="58" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="380" y="142" text-anchor="middle" font-weight="700">Agent</text>
    <text x="380" y="161" text-anchor="middle">Rollout</text>

    <rect x="474" y="118" width="116" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="532" y="142" text-anchor="middle" font-weight="700">Verifier</text>
    <text x="532" y="161" text-anchor="middle">Reward</text>

    <rect x="630" y="118" width="116" height="58" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="688" y="142" text-anchor="middle" font-weight="700">Trajectory</text>
    <text x="688" y="161" text-anchor="middle">Store</text>

    <rect x="380" y="218" width="132" height="52" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <text x="446" y="241" text-anchor="middle" font-weight="700">SFT / OPD</text>
    <text x="446" y="259" text-anchor="middle">RLVR / RL</text>

    <rect x="560" y="218" width="132" height="52" rx="10" fill="#f5f5f4" stroke="#57534e" stroke-width="2"/>
    <text x="626" y="241" text-anchor="middle" font-weight="700">Regression</text>
    <text x="626" y="259" text-anchor="middle">Gate</text>

    <rect x="740" y="218" width="132" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="806" y="241" text-anchor="middle" font-weight="700">Production</text>
    <text x="806" y="259" text-anchor="middle">Agent</text>
  </g>

  <g stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M 138 147 H 170"/>
    <path d="M 286 147 H 318"/>
    <path d="M 434 147 H 466"/>
    <path d="M 590 147 H 622"/>
    <path d="M 688 176 V 209"/>
    <path d="M 630 218 C 615 194 590 184 554 176"/>
    <path d="M 512 244 H 552"/>
    <path d="M 692 244 H 732"/>
    <path d="M 806 218 C 840 174 830 116 746 104 C 596 82 388 94 286 112"/>
  </g>
</svg>
