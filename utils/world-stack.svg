<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" role="img" aria-labelledby="title desc">
  <title id="title">Agent World Stack</title>
  <desc id="desc">Layered diagram showing runtime reset, observation and action, verifier or reward, trajectory assets, and the sandbox boundary of an agent world.</desc>
  <rect width="840" height="300" rx="18" fill="#f8fafc"/>
  <rect x="28" y="28" width="784" height="244" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="420" y="60" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Agent World Stack</text>
  <text x="420" y="86" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#475569">A resettable environment with actions, verifier rewards, trajectories, and safety boundaries</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="88" y="120" width="140" height="88" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="158" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#075985">Runtime</text>
    <text x="158" y="174" text-anchor="middle" font-size="12" fill="#0f172a">state, reset</text>
    <text x="158" y="192" text-anchor="middle" font-size="12" fill="#0f172a">replay</text>

    <rect x="246" y="120" width="140" height="88" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="316" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#166534">Interface</text>
    <text x="316" y="174" text-anchor="middle" font-size="12" fill="#0f172a">observe</text>
    <text x="316" y="192" text-anchor="middle" font-size="12" fill="#0f172a">act</text>

    <rect x="404" y="120" width="140" height="88" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="474" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#92400e">Verifier</text>
    <text x="474" y="174" text-anchor="middle" font-size="12" fill="#0f172a">reward</text>
    <text x="474" y="192" text-anchor="middle" font-size="12" fill="#0f172a">evidence</text>

    <rect x="562" y="120" width="140" height="88" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
    <text x="632" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#6b21a8">Trajectory</text>
    <text x="632" y="174" text-anchor="middle" font-size="12" fill="#0f172a">actions</text>
    <text x="632" y="192" text-anchor="middle" font-size="12" fill="#0f172a">artifacts</text>
  </g>

  <rect x="62" y="104" width="680" height="122" rx="16" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="402" y="245" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">Sandbox boundary: isolate side effects, preserve auditability, support regression gates</text>
</svg>
