name: Update hot papers

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        required: false
        default: "90"
      limit:
        description: "arXiv results to inspect"
        required: false
        default: "320"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: Refresh hot paper candidates
        run: ruby others/scripts/update_hot_papers.rb --days "${{ inputs.days || '90' }}" --limit "${{ inputs.limit || '320' }}"
      - name: Rebuild static explorer data
        run: ruby others/scripts/build_site_data.rb
      - name: Validate generated data
        run: |
          ruby others/scripts/validate_hot_papers.rb
          ruby others/scripts/validate_site.rb
          ruby others/scripts/check_file_lengths.rb
      - name: Commit updates
        run: |
          if ! git diff --quiet -- others/data/hot_papers.yaml others/docs/hot-papers.md others/docs/hot-paper-archive-*.md site/data.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add others/data/hot_papers.yaml others/docs/hot-papers.md others/docs/hot-paper-archive-*.md site/data.js
            git commit -m "chore: update hot papers"
            git push
          fi
